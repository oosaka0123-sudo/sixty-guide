<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>退職後の健康保険｜60歳が近づいてきたら。</title><link rel="canonical" href="https://oosaka0123-sudo.github.io/sixty-guide/health-insurance.html"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="index.html">60歳が近づいてきたら。</a><nav class="nav"><a href="age.html">年齢別</a><a href="pension.html">年金</a><a href="reemployment.html">再雇用</a><a href="procedures.html">手続き</a></nav></div></header><main><section><div class="wrap article"><span class="eyebrow">実用ガイド</span><h1>退職後の健康保険は3候補を比較</h1><p>退職後は、任意継続、国民健康保険、家族の健康保険の被扶養者になる方法などを比較します。保険料だけでなく扶養家族の有無でも有利不利が変わります。</p><h2>任意継続</h2><p>協会けんぽの任意継続は原則2年間。退職後は事業主負担がなくなるため、在職中より本人負担が増えます。上限や都道府県差があります。</p><h2>比較時のポイント</h2><ul><li>本人だけか扶養家族がいるか</li><li>前年所得</li><li>住んでいる自治体</li><li>再就職予定</li></ul><div class="source">最終確認: 2026-09-14｜参照先: 協会けんぽ・自治体</div></div></section></main><footer class="footer"><div class="wrap"><a href="sources.html">一次情報源</a>｜<a href="disclaimer.html">免責事項</a></div></footer></body></html>
