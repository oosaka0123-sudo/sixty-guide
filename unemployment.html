<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雇用保険｜60歳が近づいてきたら。</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="index.html">60歳が近づいてきたら。</a><nav class="nav"><a href="age.html">年齢別</a><a href="pension.html">年金</a><a href="reemployment.html">再雇用</a><a href="procedures.html">手続き</a></nav></div></header><main><section><div class="wrap article"><span class="eyebrow">実用ガイド</span><h1>60歳前後の失業給付は、退職前に確認する</h1><p>失業給付は、退職理由、雇用保険加入期間、年齢、再就職意思などで扱いが変わります。退職してから考えるより、退職日を決める前に確認する方が安全です。</p><h2>退職前に確認</h2><ul><li>自己都合か会社都合か</li><li>雇用保険の加入期間</li><li>離職票の受け取り方法</li><li>再就職の予定</li></ul><p>2025年4月から自己都合離職者の給付制限に制度変更があります。最新条件はハローワークで確認してください。</p><div class="source">最終確認: 2026-09-14｜参照先: 厚生労働省・ハローワーク</div></div></section></main><footer class="footer"><div class="wrap"><a href="sources.html">一次情報源</a>｜<a href="disclaimer.html">免責事項</a></div></footer></body></html>
