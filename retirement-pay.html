<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>退職金｜60歳が近づいてきたら。</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="index.html">60歳が近づいてきたら。</a><nav class="nav"><a href="age.html">年齢別</a><a href="pension.html">年金</a><a href="reemployment.html">再雇用</a><a href="procedures.html">手続き</a></nav></div></header><main><section><div class="wrap article"><span class="eyebrow">実用ガイド</span><h1>退職金は「金額」より受け取り方を確認</h1><p>退職金は老後資金の大きな柱ですが、企業年金やiDeCoなどと受取時期が重なると税の扱いを確認する必要があります。</p><h2>先に集める書類</h2><ul><li>退職金規程</li><li>企業年金の案内</li><li>確定拠出年金の残高・受取条件</li><li>退職所得に関する会社資料</li></ul><p>税制は個別条件で差が大きいため、具体額の判断は勤務先・税務署・税理士等に確認してください。</p><div class="source">最終確認: 2026-09-14｜参照先: 国税庁・勤務先制度</div></div></section></main><footer class="footer"><div class="wrap"><a href="sources.html">一次情報源</a>｜<a href="disclaimer.html">免責事項</a></div></footer></body></html>
